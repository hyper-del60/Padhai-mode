name: Nexo APK banao

on:
  push:
  workflow_dispatch:

permissions:
  contents: write   # Releases me APK daalne ke liye

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Project files nikalo
        run: |
          test -f nexo-project.zip || { echo "::error::nexo-project.zip repo ke root me nahi mili."; exit 1; }
          unzip -o nexo-project.zip

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Signing key taiyar karo
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::error::KEYSTORE_BASE64 aur KEYSTORE_PASSWORD secrets add karo (Settings > Secrets and variables > Actions)."
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | tr -d ' \n\r' | base64 -d > "$RUNNER_TEMP/padhai.jks"
          keytool -list -keystore "$RUNNER_TEMP/padhai.jks" -storepass "$KEYSTORE_PASSWORD" -alias padhai > /dev/null \
            || { echo "::error::KEYSTORE_BASE64 ya KEYSTORE_PASSWORD galat paste hua hai"; exit 1; }
          echo "KEYSTORE_FILE=$RUNNER_TEMP/padhai.jks" >> "$GITHUB_ENV"

      - name: Har build ka naya version number
        run: |
          CODE=$((100 + GITHUB_RUN_NUMBER))
          sed -i "s/versionCode = [0-9]*/versionCode = $CODE/; s/versionName = \"[^\"]*\"/versionName = \"1.$CODE\"/" app/build.gradle.kts
          grep -q "versionCode = $CODE" app/build.gradle.kts
          echo "APP_VERSION=1.$CODE" >> "$GITHUB_ENV"

      - name: APK banao
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: gradle assembleDebug --no-daemon

      - name: APK ko Releases me daalo
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK="Nexo-$APP_VERSION.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$APK"
          if gh release view "$APP_VERSION" > /dev/null 2>&1; then
            gh release upload "$APP_VERSION" "$APK" --clobber
          else
            gh release create "$APP_VERSION" "$APK" --title "Nexo $APP_VERSION" --notes "Nexo $APP_VERSION" --target "$GITHUB_SHA" --latest
          fi
          
