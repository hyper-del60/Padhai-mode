name: Nexo APK banao

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Project files nikalo aur jaancho
        run: |
          ls -la
          test -f nexo-project.zip || { echo "::error::nexo-project.zip repo ke sabse upar (root) me nahi mili. Naam bilkul yahi hona chahiye."; exit 1; }
          unzip -o nexo-project.zip
          grep -q '<string name="app_name">Nexo</string>' app/src/main/res/values/strings.xml \
            || { echo "::error::Zip purani hai, usme Nexo naam nahi mila."; exit 1; }
          test -f app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml \
            || { echo "::error::Zip me icon nahi mila."; exit 1; }
          echo "Nexo project files sahi hain."

      - name: Fixed signing key taiyar karo
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEYSTORE_PASSWORD" ]; then
            printf '%s' "$KEYSTORE_BASE64" | tr -d ' \n\r' | base64 -d > "$RUNNER_TEMP/padhai.jks"
            keytool -list -keystore "$RUNNER_TEMP/padhai.jks" -storepass "$KEYSTORE_PASSWORD" -alias padhai > /dev/null \
              || { echo "::error::KEYSTORE_BASE64 ya KEYSTORE_PASSWORD galat paste hua hai"; exit 1; }
            echo "KEYSTORE_FILE=$RUNNER_TEMP/padhai.jks" >> "$GITHUB_ENV"
            echo "Fixed signing key mil gayi."
          else
            echo "::warning::Signing secrets nahi mile, debug key se sign hoga (update ke liye uninstall karna padega)."
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: APK banao
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: gradle assembleDebug --no-daemon

      - name: Banayi hui APK ka naam dikhao
        continue-on-error: true
        run: |
          AAPT2=$(ls -d "$ANDROID_HOME"/build-tools/*/aapt2 2>/dev/null | sort -V | tail -1)
          {
            echo "### Nexo APK"
            "$AAPT2" dump badging app/build/outputs/apk/debug/app-debug.apk | grep -E "^package:|application-label:" | sed 's/^/- /'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: nexo-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
          
