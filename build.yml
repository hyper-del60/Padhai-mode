name: APK banao

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Project files banao
        run: |
          mkdir -p app/src/main/java/com/padhai/mode app/src/main/res/xml app/src/main/res/values
          cat > settings.gradle.kts <<'PADHAI_EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "PadhaiMode"
          include(":app")
          PADHAI_EOF
          cat > build.gradle.kts <<'PADHAI_EOF'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          PADHAI_EOF
          cat > gradle.properties <<'PADHAI_EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          kotlin.code.style=official
          PADHAI_EOF
          cat > app/build.gradle.kts <<'PADHAI_EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.padhai.mode"
              compileSdk = 34

              defaultConfig {
                  applicationId = "com.padhai.mode"
                  minSdk = 26
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0"
              }

              buildTypes {
                  release {
                      isMinifyEnabled = false
                  }
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }
              buildFeatures {
                  compose = true
              }
              composeOptions {
                  kotlinCompilerExtensionVersion = "1.5.14"
              }
          }

          dependencies {
              implementation(platform("androidx.compose:compose-bom:2024.09.00"))
              implementation("androidx.core:core-ktx:1.13.1")
              implementation("androidx.activity:activity-compose:1.9.2")
              implementation("androidx.compose.ui:ui")
              implementation("androidx.compose.material3:material3")
          }
          PADHAI_EOF
          cat > app/src/main/AndroidManifest.xml <<'PADHAI_EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <!-- Launcher apps ki list dikhane ke liye (QUERY_ALL_PACKAGES ki zaroorat nahi) -->
              <queries>
                  <intent>
                      <action android:name="android.intent.action.MAIN" />
                      <category android:name="android.intent.category.LAUNCHER" />
                  </intent>
                  <intent>
                      <action android:name="android.intent.action.MAIN" />
                      <category android:name="android.intent.category.HOME" />
                  </intent>
              </queries>

              <application
                  android:allowBackup="false"
                  android:label="@string/app_name"
                  android:supportsRtl="true"
                  android:theme="@style/Theme.PadhaiMode">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <service
                      android:name=".BlockerService"
                      android:exported="false"
                      android:label="@string/app_name"
                      android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE">
                      <intent-filter>
                          <action android:name="android.accessibilityservice.AccessibilityService" />
                      </intent-filter>
                      <meta-data
                          android:name="android.accessibilityservice"
                          android:resource="@xml/accessibility_service_config" />
                  </service>
              </application>
          </manifest>
          PADHAI_EOF
          cat > app/src/main/res/xml/accessibility_service_config.xml <<'PADHAI_EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <accessibility-service xmlns:android="http://schemas.android.com/apk/res/android"
              android:accessibilityEventTypes="typeWindowStateChanged"
              android:accessibilityFeedbackType="feedbackGeneric"
              android:accessibilityFlags="flagDefault"
              android:canRetrieveWindowContent="false"
              android:notificationTimeout="50"
              android:description="@string/service_description" />
          PADHAI_EOF
          cat > app/src/main/res/values/strings.xml <<'PADHAI_EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">Padhai Mode</string>
              <string name="service_description">Padhaai ke time sirf wahi apps khulne deta hai jo aapne allow kiye hain. Ye sirf ye dekhta hai ki kaun sa app khula hai. Koi data collect ya share nahi hota.</string>
          </resources>
          PADHAI_EOF
          cat > app/src/main/res/values/themes.xml <<'PADHAI_EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="Theme.PadhaiMode" parent="android:Theme.Material.Light.NoActionBar" />
          </resources>
          PADHAI_EOF
          cat > app/src/main/java/com/padhai/mode/Prefs.kt <<'PADHAI_EOF'
          package com.padhai.mode

          import android.content.Context

          /** Allowed apps aur session ka time phone mein save karta hai. */
          object Prefs {
              private const val FILE = "padhai_prefs"
              private const val KEY_ALLOWED = "allowed"
              private const val KEY_END = "end_time"
              private const val KEY_STRICT = "strict"

              private fun sp(c: Context) =
                  c.applicationContext.getSharedPreferences(FILE, Context.MODE_PRIVATE)

              fun getAllowed(c: Context): Set<String> =
                  sp(c).getStringSet(KEY_ALLOWED, emptySet())?.toSet() ?: emptySet()

              fun setAllowed(c: Context, apps: Set<String>) {
                  sp(c).edit().putStringSet(KEY_ALLOWED, HashSet(apps)).apply()
              }

              fun getEnd(c: Context): Long = sp(c).getLong(KEY_END, 0L)

              fun isStrict(c: Context): Boolean = sp(c).getBoolean(KEY_STRICT, false)

              fun startSession(c: Context, minutes: Int, strict: Boolean) {
                  sp(c).edit()
                      .putLong(KEY_END, System.currentTimeMillis() + minutes * 60_000L)
                      .putBoolean(KEY_STRICT, strict)
                      .apply()
              }

              fun stopSession(c: Context) {
                  sp(c).edit().putLong(KEY_END, 0L).apply()
              }

              fun isActive(c: Context): Boolean = System.currentTimeMillis() < getEnd(c)

              fun remainingMs(c: Context): Long = (getEnd(c) - System.currentTimeMillis()).coerceAtLeast(0L)
          }
          PADHAI_EOF
          cat > app/src/main/java/com/padhai/mode/BlockerService.kt <<'PADHAI_EOF'
          package com.padhai.mode

          import android.accessibilityservice.AccessibilityService
          import android.content.Intent
          import android.os.Handler
          import android.os.Looper
          import android.telecom.TelecomManager
          import android.view.accessibility.AccessibilityEvent
          import android.view.inputmethod.InputMethodManager
          import android.widget.Toast

          /**
           * Session chalu hone par har naye khule app ko check karta hai.
           * Agar app allowed list mein nahi hai, to seedha Home screen par bhej deta hai.
           */
          class BlockerService : AccessibilityService() {

              private val handler = Handler(Looper.getMainLooper())
              private var lastToastAt = 0L
              private var alwaysAllowed: Set<String> = emptySet()

              override fun onServiceConnected() {
                  super.onServiceConnected()
                  rebuildAlwaysAllowed()
              }

              override fun onAccessibilityEvent(event: AccessibilityEvent?) {
                  if (event == null || event.eventType != AccessibilityEvent.TYPE_WINDOW_STATE_CHANGED) return
                  if (!Prefs.isActive(this)) return

                  val pkg = event.packageName?.toString() ?: return
                  if (pkg == packageName) return
                  if (pkg in alwaysAllowed) return
                  if (pkg in Prefs.getAllowed(this)) return

                  // Keyboard ya launcher badla ho sakta hai, list dobara bana ke ek baar aur check karo.
                  rebuildAlwaysAllowed()
                  if (pkg in alwaysAllowed) return

                  blockNow()
              }

              private fun blockNow() {
                  performGlobalAction(GLOBAL_ACTION_HOME)

                  val now = System.currentTimeMillis()
                  if (now - lastToastAt > 2000) {
                      lastToastAt = now
                      val mins = Prefs.remainingMs(this) / 60_000L + 1
                      handler.post {
                          Toast.makeText(
                              this,
                              "Padhaai ka time hai! Abhi $mins min baaki hain.",
                              Toast.LENGTH_SHORT
                          ).show()
                      }
                  }
              }

              /** Wo apps jinhe hamesha chalne dena hai: system UI, launcher, keyboard, dialer. */
              private fun rebuildAlwaysAllowed() {
                  val set = HashSet<String>()
                  set += packageName
                  set += listOf(
                      "android",
                      "com.android.systemui",
                      "com.google.android.permissioncontroller",
                      "com.android.permissioncontroller"
                  )
                  try {
                      val home = Intent(Intent.ACTION_MAIN).addCategory(Intent.CATEGORY_HOME)
                      packageManager.queryIntentActivities(home, 0).forEach { set += it.activityInfo.packageName }
                  } catch (_: Exception) {
                  }
                  try {
                      val imm = getSystemService(INPUT_METHOD_SERVICE) as InputMethodManager
                      imm.enabledInputMethodList.forEach { set += it.packageName }
                  } catch (_: Exception) {
                  }
                  try {
                      val telecom = getSystemService(TELECOM_SERVICE) as TelecomManager
                      telecom.defaultDialerPackage?.let { set += it }
                  } catch (_: Exception) {
                  }
                  alwaysAllowed = set
              }

              override fun onInterrupt() {}
          }
          PADHAI_EOF
          cat > app/src/main/java/com/padhai/mode/MainActivity.kt <<'PADHAI_EOF'
          package com.padhai.mode

          import android.content.ComponentName
          import android.content.Context
          import android.content.Intent
          import android.net.Uri
          import android.os.Bundle
          import android.provider.Settings
          import androidx.activity.ComponentActivity
          import androidx.activity.compose.BackHandler
          import androidx.activity.compose.setContent
          import androidx.compose.foundation.Image
          import androidx.compose.foundation.clickable
          import androidx.compose.foundation.layout.*
          import androidx.compose.foundation.lazy.LazyColumn
          import androidx.compose.foundation.lazy.items
          import androidx.compose.foundation.rememberScrollState
          import androidx.compose.foundation.verticalScroll
          import androidx.compose.material3.*
          import androidx.compose.runtime.*
          import androidx.compose.ui.Alignment
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.graphics.ImageBitmap
          import androidx.compose.ui.graphics.asImageBitmap
          import androidx.compose.ui.platform.LocalContext
          import androidx.compose.ui.text.font.FontWeight
          import androidx.compose.ui.unit.Dp
          import androidx.compose.ui.unit.dp
          import androidx.compose.ui.unit.sp
          import androidx.core.graphics.drawable.toBitmap
          import kotlinx.coroutines.Dispatchers
          import kotlinx.coroutines.delay
          import kotlinx.coroutines.withContext
          import java.util.Locale

          class MainActivity : ComponentActivity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContent {
                      MaterialTheme(colorScheme = lightColorScheme()) {
                          Surface(Modifier.fillMaxSize()) { App() }
                      }
                  }
              }
          }

          data class AppItem(val pkg: String, val label: String)

          fun isServiceEnabled(ctx: Context): Boolean {
              val enabled = Settings.Secure.getString(
                  ctx.contentResolver, Settings.Secure.ENABLED_ACCESSIBILITY_SERVICES
              ) ?: return false
              val cn = ComponentName(ctx, BlockerService::class.java)
              return enabled.split(':').any {
                  it.equals(cn.flattenToString(), true) || it.equals(cn.flattenToShortString(), true)
              }
          }

          suspend fun loadApps(ctx: Context): List<AppItem> = withContext(Dispatchers.IO) {
              val pm = ctx.packageManager
              val intent = Intent(Intent.ACTION_MAIN).addCategory(Intent.CATEGORY_LAUNCHER)
              pm.queryIntentActivities(intent, 0)
                  .map { AppItem(it.activityInfo.packageName, it.loadLabel(pm).toString()) }
                  .filter { it.pkg != ctx.packageName }
                  .distinctBy { it.pkg }
                  .sortedBy { it.label.lowercase() }
          }

          fun fmt(ms: Long): String {
              val total = (ms / 1000).coerceAtLeast(0)
              val h = total / 3600
              val m = (total % 3600) / 60
              val s = total % 60
              return if (h > 0) String.format(Locale.US, "%d:%02d:%02d", h, m, s)
              else String.format(Locale.US, "%02d:%02d", m, s)
          }

          @Composable
          fun App() {
              val ctx = LocalContext.current
              var screen by remember { mutableStateOf("home") }
              var now by remember { mutableStateOf(System.currentTimeMillis()) }
              var allowed by remember { mutableStateOf(Prefs.getAllowed(ctx)) }

              LaunchedEffect(Unit) {
                  while (true) {
                      now = System.currentTimeMillis()
                      delay(1000)
                  }
              }
              val serviceOn = remember(now) { isServiceEnabled(ctx) }

              if (screen == "pick") {
                  PickScreen(initial = allowed) { chosen ->
                      allowed = chosen
                      Prefs.setAllowed(ctx, chosen)
                      screen = "home"
                  }
              } else {
                  HomeScreen(
                      now = now,
                      serviceOn = serviceOn,
                      allowedCount = allowed.size,
                      onPick = { screen = "pick" },
                      refresh = { now = System.currentTimeMillis() }
                  )
              }
          }

          @Composable
          fun HomeScreen(
              now: Long,
              serviceOn: Boolean,
              allowedCount: Int,
              onPick: () -> Unit,
              refresh: () -> Unit
          ) {
              val ctx = LocalContext.current
              val end = Prefs.getEnd(ctx)
              val active = now < end
              var minutes by remember { mutableStateOf(60f) }
              var strict by remember { mutableStateOf(false) }
              var confirmStop by remember { mutableStateOf(false) }

              Column(
                  Modifier
                      .fillMaxSize()
                      .verticalScroll(rememberScrollState())
                      .padding(20.dp),
                  verticalArrangement = Arrangement.spacedBy(16.dp)
              ) {
                  Text("Padhai Mode", fontSize = 30.sp, fontWeight = FontWeight.Bold)
                  Text(
                      "Padhaai ke time sirf wahi apps khulenge jo aap chunoge.",
                      color = MaterialTheme.colorScheme.onSurfaceVariant
                  )

                  if (!serviceOn) SetupCard()

                  if (active) {
                      Card(Modifier.fillMaxWidth()) {
                          Column(
                              Modifier
                                  .fillMaxWidth()
                                  .padding(20.dp),
                              verticalArrangement = Arrangement.spacedBy(8.dp),
                              horizontalAlignment = Alignment.CenterHorizontally
                          ) {
                              Text("Padhaai chal rahi hai", fontWeight = FontWeight.Medium)
                              Text(fmt(end - now), fontSize = 56.sp, fontWeight = FontWeight.Bold)
                              Text(
                                  "$allowedCount apps allowed hain",
                                  color = MaterialTheme.colorScheme.onSurfaceVariant
                              )
                              if (Prefs.isStrict(ctx)) {
                                  Text(
                                      "Strict mode ON hai. Time poora hone tak rok nahi sakte.",
                                      color = MaterialTheme.colorScheme.onSurfaceVariant
                                  )
                              } else {
                                  OutlinedButton(onClick = { confirmStop = true }) { Text("Session rokna hai") }
                              }
                          }
                      }
                  } else {
                      Text("Kitni der padhna hai: ${minutes.toInt()} minute", fontWeight = FontWeight.Medium)
                      Slider(
                          value = minutes,
                          onValueChange = { minutes = it },
                          valueRange = 10f..180f,
                          steps = 33
                      )
                      Row(Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.spacedBy(8.dp)) {
                          listOf(25, 45, 60, 90).forEach { m ->
                              OutlinedButton(
                                  onClick = { minutes = m.toFloat() },
                                  modifier = Modifier.weight(1f),
                                  contentPadding = PaddingValues(0.dp)
                              ) { Text("$m min") }
                          }
                      }

                      Card(Modifier.fillMaxWidth()) {
                          Row(Modifier.padding(16.dp), verticalAlignment = Alignment.CenterVertically) {
                              Column(Modifier.weight(1f)) {
                                  Text("Allowed apps", fontWeight = FontWeight.Medium)
                                  Text(
                                      if (allowedCount == 0) "Abhi koi app nahi chuna" else "$allowedCount apps chune hain",
                                      color = MaterialTheme.colorScheme.onSurfaceVariant
                                  )
                              }
                              Button(onClick = onPick) { Text("Chuno") }
                          }
                      }

                      Row(verticalAlignment = Alignment.CenterVertically) {
                          Column(Modifier.weight(1f)) {
                              Text("Strict mode", fontWeight = FontWeight.Medium)
                              Text(
                                  "ON karoge to session beech mein rok nahi paoge.",
                                  color = MaterialTheme.colorScheme.onSurfaceVariant
                              )
                          }
                          Switch(checked = strict, onCheckedChange = { strict = it })
                      }

                      if (allowedCount == 0) {
                          Text(
                              "Koi app allowed nahi hai, to sirf phone dialer khula rahega.",
                              color = MaterialTheme.colorScheme.onSurfaceVariant
                          )
                      }

                      Button(
                          onClick = {
                              Prefs.startSession(ctx, minutes.toInt(), strict)
                              refresh()
                          },
                          enabled = serviceOn,
                          modifier = Modifier
                              .fillMaxWidth()
                              .height(52.dp)
                      ) { Text("Padhaai shuru karo") }

                      if (!serviceOn) {
                          Text(
                              "Shuru karne se pehle upar wala setup poora karo.",
                              color = MaterialTheme.colorScheme.onSurfaceVariant
                          )
                      }
                  }
              }

              if (confirmStop) {
                  AlertDialog(
                      onDismissRequest = { confirmStop = false },
                      title = { Text("Session rok dein?") },
                      text = { Text("Abhi ${fmt(end - now)} baaki hai. Rokne ke baad saare apps khul jayenge.") },
                      confirmButton = {
                          TextButton(onClick = {
                              Prefs.stopSession(ctx)
                              confirmStop = false
                              refresh()
                          }) { Text("Haan, roko") }
                      },
                      dismissButton = {
                          TextButton(onClick = { confirmStop = false }) { Text("Nahi, padhta hoon") }
                      }
                  )
              }
          }

          @Composable
          fun SetupCard() {
              val ctx = LocalContext.current
              Card(
                  Modifier.fillMaxWidth(),
                  colors = CardDefaults.cardColors(containerColor = MaterialTheme.colorScheme.errorContainer)
              ) {
                  Column(Modifier.padding(16.dp), verticalArrangement = Arrangement.spacedBy(10.dp)) {
                      Text("Pehle ek setup karo", fontWeight = FontWeight.Bold)
                      Text(
                          "Accessibility settings mein 'Padhai Mode' dhundho aur usse ON karo. " +
                              "Ye sirf dekhta hai ki kaun sa app khula hai, aur kuch nahi padhta."
                      )
                      Text(
                          "Agar ON nahi ho raha ya 'Restricted setting' dikhe: App info kholo, upar teen dot dabao, " +
                              "'Allow restricted settings' chuno, phir dobara try karo."
                      )
                      Button(onClick = {
                          ctx.startActivity(Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS))
                      }) { Text("Accessibility settings kholo") }
                      OutlinedButton(onClick = {
                          ctx.startActivity(
                              Intent(
                                  Settings.ACTION_APPLICATION_DETAILS_SETTINGS,
                                  Uri.parse("package:${ctx.packageName}")
                              )
                          )
                      }) { Text("App info kholo") }
                  }
              }
          }

          @Composable
          fun AppIcon(pkg: String, size: Dp = 40.dp) {
              val ctx = LocalContext.current
              val bmp by produceState<ImageBitmap?>(initialValue = null, pkg) {
                  value = withContext(Dispatchers.IO) {
                      try {
                          ctx.packageManager.getApplicationIcon(pkg).toBitmap(96, 96).asImageBitmap()
                      } catch (e: Exception) {
                          null
                      }
                  }
              }
              val b = bmp
              if (b != null) {
                  Image(bitmap = b, contentDescription = null, modifier = Modifier.size(size))
              } else {
                  Spacer(Modifier.size(size))
              }
          }

          @Composable
          fun PickScreen(initial: Set<String>, onDone: (Set<String>) -> Unit) {
              val ctx = LocalContext.current
              var apps by remember { mutableStateOf<List<AppItem>?>(null) }
              var selected by remember { mutableStateOf(initial) }
              var query by remember { mutableStateOf("") }

              LaunchedEffect(Unit) { apps = loadApps(ctx) }
              BackHandler { onDone(selected) }

              Column(
                  Modifier
                      .fillMaxSize()
                      .padding(horizontal = 16.dp)
              ) {
                  Text(
                      "Allowed apps chuno",
                      fontSize = 24.sp,
                      fontWeight = FontWeight.Bold,
                      modifier = Modifier.padding(top = 20.dp)
                  )
                  Text(
                      "Padhaai ke time ye apps khule rahenge, baaki sab band.",
                      color = MaterialTheme.colorScheme.onSurfaceVariant,
                      modifier = Modifier.padding(vertical = 8.dp)
                  )
                  OutlinedTextField(
                      value = query,
                      onValueChange = { query = it },
                      label = { Text("App dhundho") },
                      singleLine = true,
                      modifier = Modifier.fillMaxWidth()
                  )

                  val list = apps
                  if (list == null) {
                      Box(Modifier.weight(1f).fillMaxWidth(), contentAlignment = Alignment.Center) {
                          CircularProgressIndicator()
                      }
                  } else {
                      val shown = list.filter { it.label.contains(query, ignoreCase = true) }
                      LazyColumn(Modifier.weight(1f)) {
                          items(shown, key = { it.pkg }) { app ->
                              val on = app.pkg in selected
                              Row(
                                  Modifier
                                      .fillMaxWidth()
                                      .clickable {
                                          selected = if (on) selected - app.pkg else selected + app.pkg
                                      }
                                      .padding(vertical = 8.dp),
                                  verticalAlignment = Alignment.CenterVertically
                              ) {
                                  AppIcon(app.pkg)
                                  Spacer(Modifier.width(12.dp))
                                  Text(app.label, Modifier.weight(1f))
                                  Checkbox(checked = on, onCheckedChange = null)
                              }
                          }
                      }
                  }

                  Button(
                      onClick = { onDone(selected) },
                      modifier = Modifier
                          .fillMaxWidth()
                          .padding(vertical = 12.dp)
                  ) { Text("Ho gaya (${selected.size} chune)") }
              }
          }
          PADHAI_EOF

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Debug APK banao
        run: gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: padhai-mode-apk
          path: app/build/outputs/apk/debug/app-debug.apk
